
name: Build Save the Earth APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract original game ZIP
        run: |
          unzip -o "save-the-earth-nov-18-2026-2-30-26-pm.zip" -d .

      - name: Fix esbuild version
        run: npm pkg set devDependencies.esbuild="^0.28.0"

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.6.2 @capacitor/android@8.6.2
          npm install -D @capacitor/cli@8.6.2

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build
      - name: Prepare Android project
        run: rm -rf android
      - name: Create Android project
        run: npx cap add android

      - name: Sync game
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Save-the-Earth-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add Capacitor Android project"
          git push
          
