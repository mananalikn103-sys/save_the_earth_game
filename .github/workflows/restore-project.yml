
name: Restore Original Game Files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract original game ZIP
        run: |
          unzip -o "save-the-earth-nov-18-2026-2-30-26-pm.zip" -d .
         - name: Fix esbuild version
        run: npm pkg set devDependencies.esbuild="^0.28.0"
      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build
      - name: Save restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore original game folder structure"
          git push
          
